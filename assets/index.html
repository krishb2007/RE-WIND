<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <title>RE-WIND — Cinematic Mockup</title>
  <style>
    :root { color-scheme:dark; --paper:#e9e1d8; --dim:#afa49b; --red:#cc444e; }
    * {box-sizing:border-box}
    html,body {width:100%;height:100%;margin:0;background:#050506;font-family:Arial,Helvetica,sans-serif}
    body {display:flex;align-items:center;justify-content:center;overflow:hidden}
    button {font:inherit;cursor:pointer}
    .screen {
      width:min(100vw,calc(100vh * 1672 / 941));
      aspect-ratio:1672/941;
      position:relative;overflow:hidden;
      background:#101010;
      box-shadow:0 0 100px #000;
      isolation:isolate;
    }
    .track {display:flex;height:100%;width:100%;transform:translateX(-100%);transition:transform .48s cubic-bezier(.23,.73,.29,1)}
    .scene {position:relative;flex:0 0 100%;height:100%;overflow:hidden}
    .scene > .scene-art {position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
    .hit {
      position:absolute;z-index:7;background:transparent;border:0;border-radius:6px;
      padding:0;color:transparent;outline:none;
      -webkit-tap-highlight-color:transparent;
    }
    .hit:hover {background:rgba(255,255,255,.075);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
    .hit:focus-visible {outline:2px solid #edb7ac;outline-offset:2px;background:rgba(255,255,255,.09)}
    .hit[disabled] {pointer-events:none}
    .album-hit {z-index:8;overflow:visible;border-radius:0}
    .album-hit:hover,.album-hit:focus-visible {background:none;box-shadow:none}
    .album-hit img {
      display:block;width:100%;height:100%;object-fit:fill;
      opacity:0;transform:translateY(0) scale(1);
      transition:opacity .13s ease, transform .22s ease,filter .22s;
      pointer-events:none;box-shadow:none;
    }
    .album-hit:hover img,.album-hit:focus-visible img {
      opacity:1;transform:translateY(-7%) scale(1.045);
      filter:drop-shadow(0 16px 12px #000b);
    }
    .album-hit.selected:after {content:"";position:absolute;inset:0;border:2px solid rgba(233,173,145,.9);box-shadow:0 0 15px #dba27a55;pointer-events:none;border-radius:2px}
    .album-hit:hover:after {transform:translateY(-7%) scale(1.045)}
    /* The QUEUE is a real HTML layer beside the generated, photorealistic player art. */
    .queue-dock {position:absolute;z-index:3;left:70.1%;top:46%;width:26.4%;height:49%;color:var(--paper);pointer-events:none}
    .queue-top {display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ccb59b63;padding:0 2% 3%;font-size:clamp(7px,.94vw,14px);font-weight:800;letter-spacing:.22em;text-shadow:0 2px 7px #000}
    .queue-top small {font-size:clamp(6px,.7vw,10px);font-weight:normal;color:#c2a993;letter-spacing:.13em}
    .queue-stack {height:65%;position:relative;perspective:700px;margin-top:4%;pointer-events:auto}
    .queued-disc {
      position:absolute;left:25%;top:9%;width:51%;aspect-ratio:1.08;
      padding:0;overflow:hidden;background:#222;
      border:clamp(1px,.13vw,2px) solid #d7c1aa8a;border-radius:2%;
      box-shadow:2px 8px 2px #160e0a,6px 11px 17px #0008,inset 0 0 4px #fff6;
      transform:var(--pose);transition:transform .24s ease,box-shadow .24s ease;
      pointer-events:auto;cursor:pointer;
    }
    .queued-disc img {display:block;width:100%;height:100%;object-fit:cover}
    .queued-disc:nth-child(1){--pose:translate(28%,20%) rotate(12deg);z-index:1}
    .queued-disc:nth-child(2){--pose:translate(11%,10%) rotate(5deg);z-index:2}
    .queued-disc:nth-child(3){--pose:translate(-12%,0%) rotate(-4deg);z-index:3}
    .queued-disc:nth-child(4){--pose:translate(-29%,-8%) rotate(-11deg);z-index:4}
    .queued-disc:hover {transform:var(--pose) translateY(-10%) scale(1.06);box-shadow:3px 17px 24px #000c}
    .queued-disc:focus-visible {outline:2px solid #f1c4a4;outline-offset:4px}
    .queue-bottom {margin-top:-2%;border-top:1px solid #b99d805c;padding:3.6% 2% 0;display:grid;gap:7px;pointer-events:auto}
    .queue-row {display:flex;align-items:center;gap:9px;color:#eee0d0;font-size:clamp(7px,.83vw,12px);text-shadow:0 2px 5px #000;cursor:pointer}
    .queue-row strong {font-size:.85em;color:#d79b85;font-family:monospace}
    .queue-row:hover {color:#fff}
    .queue-row span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .queue-row em {margin-left:auto;font-style:normal;color:#b9a99b;letter-spacing:.08em}
    .tiny-status {position:absolute;z-index:5;left:56%;top:73.7%;font-family:monospace;letter-spacing:.1em;font-size:clamp(7px,.76vw,12px);color:#fff2df;opacity:0;text-shadow:0 0 8px #f1b8a6;transition:opacity .24s}
    .scene.playing .tiny-status {opacity:1}
    .play-led {position:absolute;left:60.7%;top:53.2%;width:.66%;aspect-ratio:1;background:#f33b3a;border-radius:50%;opacity:0;box-shadow:0 0 16px 4px #f23f40b3;transition:opacity .25s}
    .scene.playing .play-led {opacity:1;animation:pulse 1.2s infinite alternate}
    @keyframes pulse {from{opacity:.3}to{opacity:1}}
    .toast {
      position:absolute;z-index:20;bottom:2.6%;left:50%;transform:translateX(-50%) translateY(8px);
      padding:11px 19px;background:#0a0908eb;border:1px solid #a68a7280;color:#f5e6d9;
      border-radius:7px;opacity:0;transition:opacity .22s,transform .22s;font-size:clamp(10px,.9vw,14px);
      letter-spacing:.07em;pointer-events:none;white-space:nowrap;box-shadow:0 12px 27px #000b;
    }
    .toast.show {opacity:1;transform:translateX(-50%) translateY(0)}
    .live-readout {position:absolute;z-index:6;bottom:1%;right:1%;color:#d3c7bb8a;font-size:clamp(7px,.62vw,10px);letter-spacing:.1em;pointer-events:none}
    .mobile-nav {display:none}
    @media(max-width:700px){
      body{align-items:flex-start;padding-top:16vh}
      .queue-row {gap:3px}
      .toast {bottom:-11%;font-size:10px}
      .mobile-nav{display:flex;position:fixed;bottom:8vh;left:0;right:0;justify-content:center;gap:12px;z-index:30}
      .mobile-nav button{background:#25201d;color:white;border:1px solid #6f6057;border-radius:9px;padding:11px 18px}
      .queue-dock{left:69.7%}
    }
    @media(prefers-reduced-motion:reduce){.track,.album-hit img,.queued-disc,.toast{transition:none}}
  </style>
</head>
<body>
  <main class="screen" id="app" aria-label="RE-WIND mockup application">
    <div class="track" id="track">
      <section class="scene" id="settings" aria-label="Settings window">
        <img class="scene-art" src="assets/settings.png" alt="Photorealistic RE-WIND audio settings rack with knobs, toggles and analog meters">
      </section>
      <section class="scene" id="player" aria-label="Player window">
        <img class="scene-art" src="assets/player.png" alt="Photorealistic black suitcase-style CD player resting on a dark wooden table">
        <span class="tiny-status" id="playStatus">▶ DEMO PLAYING</span>
        <span class="play-led" aria-hidden="true"></span>
        <aside class="queue-dock" aria-label="Up next CD queue">
          <div class="queue-top"><span>UP NEXT</span><small id="queueCount">04 DISCS</small></div>
          <div class="queue-stack" id="queueStack"></div>
          <div class="queue-bottom" id="queueLines"></div>
        </aside>
      </section>
      <section class="scene" id="library" aria-label="Library window">
        <img class="scene-art" src="assets/library.png" alt="Photorealistic wooden library shelf showing eight original jewel-case album covers in four columns per row">
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="live-readout">VISUAL UI PROTOTYPE · AUDIO NOT CONNECTED</div>
  </main>
  <nav class="mobile-nav" aria-label="Window navigation"><button type="button" id="mobilePrev">← Back</button><button type="button" id="mobileNext">Next →</button></nav>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const sceneNames = ['SETTINGS','PLAYER','LIBRARY'];
    const albums = [
      {title:'North Lights',artist:'North Lights',cover:'assets/cd1.png'},
      {title:'Petal Static',artist:'Petal Static',cover:'assets/cd2.png'},
      {title:'Orbital Drift',artist:'Orbital Drift',cover:'assets/cd3.png'},
      {title:'Midnight Lanes',artist:'Midnight Lanes',cover:'assets/cd4.png'},
      {title:'Tides',artist:'Tides',cover:'assets/cd5.png'},
      {title:'Fracture Plans',artist:'Fracture Plans',cover:'assets/cd6.png'},
      {title:'Slow Rooms',artist:'Slow Rooms',cover:'assets/cd7.png'},
      {title:'Vacant Frequencies',artist:'Vacant Frequencies',cover:'assets/cd8.png'}
    ];
    let view = 1;
    let playing = false;
    let queue = [0,1,2,3];
    let toastTimer;
    function message(msg){
      const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
    }
    function navigate(index){
      view=Math.max(0,Math.min(2,index));
      $('track').style.transform=`translateX(-${view*100}%)`;
      [...document.querySelectorAll('.scene')].forEach((s,i)=>s.setAttribute('aria-hidden',String(i!==view)));
      $('mobilePrev').disabled=view===0;$('mobileNext').disabled=view===2;
    }
    function hotspot(parent,rect,label,onClick,extra=''){
      const btn=document.createElement('button');
      btn.type='button';btn.className='hit '+extra;btn.setAttribute('aria-label',label);btn.title=label;
      btn.style.left=rect[0]+'%';btn.style.top=rect[1]+'%';btn.style.width=rect[2]+'%';btn.style.height=rect[3]+'%';
      btn.addEventListener('click',onClick);parent.appendChild(btn);return btn;
    }
    // Clickable artwork navigation; percentages are based on the 1672×941 mockups.
    document.querySelectorAll('.scene').forEach(scene=>{
      hotspot(scene,[31.0,2.2,3.5,6.4],'Previous window',()=>navigate(view-1));
      hotspot(scene,[65.2,2.2,3.5,6.4],'Next window',()=>navigate(view+1));
      hotspot(scene,[34.4,2.3,9.1,6.1],'Settings',()=>navigate(0));
      hotspot(scene,[44.0,2.3,10.2,6.1],'Player',()=>navigate(1));
      hotspot(scene,[55.7,2.3,10.1,6.1],'Library',()=>navigate(2));
    });
    // Real click targets aligned over photographed transport buttons.
    const deck=$('player');
    hotspot(deck,[36.3,79.5,6.0,5.8],'Previous demo disc',()=>message('Previous disc · visual demo'));
    hotspot(deck,[42.6,79.5,5.9,5.8],'Play / pause animation',()=>{
      playing=!playing;deck.classList.toggle('playing',playing);
      $('playStatus').textContent=playing?'▶ DEMO PLAYING':'Ⅱ PAUSED';
      message(playing?'Demo playback indicator on · no audio loaded':'Paused');
    });
    hotspot(deck,[48.7,79.5,6.1,5.8],'Stop demo',()=>{playing=false;deck.classList.remove('playing');message('Stopped');});
    hotspot(deck,[55.0,79.5,6.1,5.8],'Next demo disc',()=>message('Next disc · visual demo'));
    // Album hit areas follow the actual 4-per-row artwork. Hover lifts a cropped
    // copy of the photographed jewel case; click adds the CD to the right-hand queue.
    const rectangles=[
      [3.4,13.1,22.9,35.2],[27.0,13.1,22.2,35.2],[50.5,13.1,22.4,35.2],[73.1,13.1,22.8,35.2],
      [3.4,52.1,22.9,34.4],[27.0,52.1,22.2,34.4],[50.5,52.1,22.4,34.4],[73.1,52.1,22.8,34.4]
    ];
    rectangles.forEach((rect,i)=>{
      const btn=hotspot($('library'),rect,'Add '+albums[i].title+' to queue',()=>{
        queue.push(i);renderQueue();message(albums[i].title+' added to queue');
        document.querySelectorAll('.album-hit').forEach(a=>a.classList.remove('selected'));
        btn.classList.add('selected');
      },'album-hit');
      const img=document.createElement('img');img.src=albums[i].cover;img.alt='';img.setAttribute('aria-hidden','true');btn.appendChild(img);
    });
    function renderQueue(){
      $('queueCount').textContent=String(queue.length).padStart(2,'0')+' DISCS';
      const stack=$('queueStack'),list=$('queueLines');stack.replaceChildren();list.replaceChildren();
      const last=queue.slice(-4); // Show the four most recently queued jewel cases.
      last.forEach((id,j)=>{
        const cd=document.createElement('button');cd.className='queued-disc';cd.type='button';
        cd.title=albums[id].title+' — click to remove from queue';cd.setAttribute('aria-label','Remove '+albums[id].title+' from queue');
        const img=document.createElement('img');img.src=albums[id].cover;img.alt='';cd.append(img);
        cd.addEventListener('click',()=>{const ix=queue.lastIndexOf(id);if(ix>=0)queue.splice(ix,1);renderQueue();message(albums[id].title+' removed from queue');});stack.append(cd);
      });
      queue.slice(0,3).forEach((id,i)=>{
        const row=document.createElement('div');row.className='queue-row';
        const number=document.createElement('strong');number.textContent=String(i+1).padStart(2,'0');
        const text=document.createElement('span');text.textContent=albums[id].title;
        const more=document.createElement('em');more.textContent='CD';row.append(number,text,more);list.append(row);
      });
      if(!queue.length){const empty=document.createElement('div');empty.className='queue-row';empty.textContent='Select a CD from Library';list.append(empty);}
    }
    document.addEventListener('keydown',e=>{
      if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
      if(e.key==='ArrowLeft'){e.preventDefault();navigate(view-1)}
      if(e.key==='ArrowRight'){e.preventDefault();navigate(view+1)}
    });
    $('mobilePrev').addEventListener('click',()=>navigate(view-1));
    $('mobileNext').addEventListener('click',()=>navigate(view+1));
    renderQueue();navigate(1);
  </script>
</body>
</html>
